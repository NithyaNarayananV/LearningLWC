<template>
    <lightning-input 
        label="Message" 
        type="text" 
        value={userInput} 
        onchange={handleInputChange}>
    </lightning-input>
    <lightning-button 
        variant="brand" 
        label="Send" 
        value={userInput} 
        
        onclick={handleSend}>
    </lightning-button>
    <div>
        <lightning-card title="Oh.. you said: ">
            <p>user : {userInput}</p>    
        </lightning-card>
    </div>     
    
    <lightning-card title="Oh.. See your History: 1">
            <div class="slds-m-top_medium" title="Chat Message">
                <template for:each={chatMessages} for:item="msg" >
                    <div key={msg.id}> ⚫ {msg.text}</div>
                </template>
            </div>
    </lightning-card>
    <lightning-card title="Koa Chat with Agentforce 1">
        <div class="slds-p-around_medium">
            <lightning-input label="Your Message" value={userInput} onchange={handleInput}></lightning-input>
            <lightning-button label="Send" onclick={handleSend} class="slds-m-top_small"></lightning-button>
            <ul class="slds-m-top_medium">
                <template for:each={chatHistory} for:item="msg">
                    <li key={msg}>{msg}</li>
                </template>
            </ul>
        </div>
    </lightning-card>
    
</template>
