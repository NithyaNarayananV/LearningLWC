<template>
    <lightning-card> 
        <div> Salesforce Form </div>
        <br>
        <div> </div>
        <lightning-input 
          label="Please enter your Aadhaar Number and Attach its Document"
          placeholder="Aadhaar Number" 
          value={youtubeUrl}>
        </lightning-input>
 
        <lightning-button 
          label="Click to Attach Aadhaar Document" 
          onclick={handleConvertClick}>
        </lightning-button>
        <lightning-file-upload
            label="Attach Document"
            name="fileUploader"
            accept=".pdf,.doc,.docx,.png,.jpg"
            record-id={recordId}
            onuploadfinished={handleUploadFinished}>
        </lightning-file-upload>

    </lightning-card>
</template>
