<template>

  <body>
    <section class="auth-section">
      <div class="auth-container">
        <!-- Form Container -->
        <div class="auth-form-container">

          <!-- LOGIN FORM -->
          <form class="auth-form" id="login-form">
            <h1 class="auth-title">Welcome Back!</h1>
            <p class="auth-subtitle">Login to continue your sweet journey 🍯</p>

            <div class="form-group">
              <label for="login-email">Email</label>
              <input type="email" id="login-email" onchange={handleEmailChange} value={email} placeholder="you@example.com" required />
            </div>
            <button type="button" onclick={handleSendOTP} class="form-button">Send OTP</button>

            <div class="form-group">
              <label for="login-password">OTP</label>
              <div >
                <input 
                  type="text" 
                  onchange={handleOTPChange} 
                  variant="label-hidden" 
                  class="otp-box"
                  max-length="4" 
                  pattern="[0-9]*"
                  inputmode="numeric"
                  value={otp} 
                  placeholder="Enter your OTP"
                />
              </div>
            </div>

            <button type="button"  onclick={handleLogin} class="form-button" >Login</button>

            <p class="auth-footer-text">
              Don't have an account?
              <button type="button" class="auth-toggle-btn" id="show-register">Register here</button>
            </p>
          </form>

          <!-- REGISTER FORM -->
          <form class="auth-form hidden" id="register-form">
            <h1 class="auth-title">Create Your Account</h1>
            <p class="auth-subtitle">Join us and enjoy exclusive offers!</p>

            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" id="username" placeholder="Enter your username" required />
            </div>

            <div class="form-group">
              <label for="mobile">Mobile Number</label>
              <input type="tel" id="mobile" placeholder="e.g. +91 9876543210" required />
            </div>

            <div class="form-group">
              <label for="register-email">Email</label>
              <input type="email" id="register-email" placeholder="you@example.com" required />
            </div>

            <div class="form-group-inline">
              <div class="form-group">
                <label for="register-password">Password</label>
                <div class="password-field">
                  <input type="password" id="register-password" required />
                  <button type="button" class="toggle-password" data-target="register-password">👁️</button>
                </div>
              </div>
              <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <div class="password-field">
                  <input type="password" id="confirm-password" required />
                  <button type="button" class="toggle-password" data-target="confirm-password">👁️</button>
                </div>
              </div>
            </div>

            <button type="submit" class="form-button">Register</button>

            <p class="auth-footer-text">
              Already have an account?
              <button type="button" class="auth-toggle-btn" id="show-login">Login here</button>
            </p>
          </form>
        </div>

        <!-- Right: Illustration -->
        <div class="auth-image-container">
          <img src="images/register-illustration.png" alt="Halwa Shop Illustration" class="auth-image" />
          <p class="auth-caption">Sweet moments start here ✨</p>
        </div>
      </div>
    </section>
</template>
