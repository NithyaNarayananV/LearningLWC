<template>
        <section class="page-hero">
            <div class="container">
                <h1>Checkout</h1>
                <p>Complete your order</p>
            </div>
        </section>

        <section class="checkout-section">
            <div class="checkout-container">
                <!-- Left Column -->
                <div class="checkout-left">
                    <div class="checkout-card">
                        <h2>Shipping Information</h2>
                        <form id="shipping-form" class="checkout-form">
                            <label for="fullname">Full Name</label>
                            <input type="text" id="fullname" placeholder="Enter your name" required value={siteUser.Name}  onblur={setName} />

                            <label for="street">Street</label>
                            <input 
                                id="street" 
                                type="text" 
                                placeholder="House number, street" 
                                required 
                                value={siteUser.Street} 
                                onblur={setStreet}
                            />

                            <label for="city">City</label>
                            <input 
                                id="city" 
                                type="text" 
                                placeholder="City" 
                                required 
                                value={siteUser.City} 
                                onblur={setCity}
                            />

                            <label for="state">State</label>
                            <input 
                                id="state" 
                                type="text" 
                                placeholder="State" 
                                required 
                                value={siteUser.State} 
                                onblur={setState}
                            />

                            <label for="postalCode">Postal Code</label>
                            <input 
                                id="postalCode" 
                                type="text" 
                                placeholder="Postal Code" 
                                required 
                                value={siteUser.PostalCode} 
                                onblur={setPostalCode}
                            />

                            <label for="country">Country</label>
                            <input 
                                id="country" 
                                type="text" 
                                placeholder="Country" 
                                required 
                                value={siteUser.Country} 
                                onblur={setCountry}
                            />

                            <label for="phone">Mobile Number</label>
                            <input type="tel" id="phone" placeholder="+91 XXXXX XXXXX"  pattern="(\+91)?[6-9][0-9]{9}" required value={siteUser.MobilePhone} onblur={setPhone}/>

                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="you@example.com"    pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" required  value={siteUser.Email} onblur={setEmail}/>
                        </form>
                    </div>

                    <div class="checkout-card">
                        <h2>Payment Method</h2>
                        <div class="payment-options">
                            <label class="payment-option">
                                <input type="radio" name="payment" value="gpay"  disabled />
                                <span class="icon">📱</span> Google Pay (UPI)
                            </label>
                            <label class="payment-option">
                                <input type="radio" name="payment" value="cod" checked />
                                <span class="icon">💰</span> Cash on Delivery
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Right Column -->
                <div class="checkout-right">
                    <div class="checkout-card order-summary">
                        <h2>Your Order</h2>
                        <div id="order-summary"></div>
                        <div class="summary-item">
                            <div class="item-details"> 
                                <template for:each={halwaProducts} for:item="product">
                                    <template if:true={product.selected}>
                                        <div key={product.id} class="cart-item">                                             
                                            <span class="cart-cell"><strong>{product.name}</strong></span>
                                            <span class="cart-cell">₹{product.price} <strong>X</strong> {product.quantity}</span>
                                            <span class="cart-cell">₹{product.orderPrice}</span>
                                        </div> 
                                    </template>
                                </template>
                            </div>
                        </div>
                        <div class="summary-line">
                            <span>Total Items</span><span><p class="item-total">{summary.totalCount}</p></span>
                        </div>
                        <div class="summary-line">
                            <span>Subtotal</span><span id="order-subtotal">₹{summary.totalPrice}</span>
                        </div>

                        <div class="summary-line">
                            <span>Shipping</span><span id="order-shipping">₹0</span>
                        </div>
                        
                        <div class="summary-line total">
                            <span>Total</span><span id="order-total">₹{summary.totalPrice}</span>
                        </div>

                        <button id="place-order-btn" class="place-order-btn" disabled={isPlaceOrderDisabled} onclick={onPlaceOrderHandler}>
                            Place Order
                        </button>
                    </div>
                </div>
            </div>
        </section>
</template>
