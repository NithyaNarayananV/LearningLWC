<template>
        <section class="page-hero">
            <div class="container">
                <h1>Checkout</h1>
                <p>Complete your order</p>
            </div>
        </section>

        <section class="checkout-section">
            <div class="checkout-container">
                <!-- Left Column -->
                <div class="checkout-left">
                    <div class="checkout-card">
                        <h2>Shipping Information</h2>
                        <form id="shipping-form" class="checkout-form">
                            <label for="fullname">Full Name</label>
                            <input type="text" id="fullname" placeholder="Enter your name" required value={name}  onblur={setName} />

                            <label for="address">Address</label>
                            <textarea id="address" placeholder="House number, street, city" required value={address} onblur={setAddress}></textarea>

                            <label for="phone">Mobile Number</label>
                            <input type="tel" id="phone" placeholder="+91 XXXXX XXXXX"  pattern="(\+91)?[6-9][0-9]{9}" required value={phone} onblur={setPhone}/>

                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="you@example.com"    pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" required  value={email} onblur={setEmail}/>
                        </form>
                    </div>

                    <div class="checkout-card">
                        <h2>Payment Method</h2>
                        <div class="payment-options">
                            <label class="payment-option">
                                <input type="radio" name="payment" value="gpay"  disabled />
                                <span class="icon">📱</span> Google Pay (UPI)
                            </label>
                            <label class="payment-option">
                                <input type="radio" name="payment" value="cod" checked />
                                <span class="icon">💰</span> Cash on Delivery
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Right Column -->
                <div class="checkout-right">
                    <div class="checkout-card order-summary">
                        <h2>Your Order</h2>
                        <div id="order-summary"></div>
                        <div class="summary-item">
                            <div class="item-details">
                                <template for:each={halwaProducts} for:item="product" for:index="index">
                                <template if:true={product.selected}>
                                    <div class="cart-item" key={product.id}>
                                        <div class="cart-item-info">
                                            <div class="cart-item-details">
                                                <h3>{product.name}</h3>
                                                <p>₹{product.price}/kg</p>
                                                <p>Qty: {product.quantity} Kg</p>
                                                <p>Order Price: ₹{product.orderPrice}</p>
                                            </div>
                                        </div>
                                    </div>  
                                </template>
                            </template>
                            <strong>$ </strong>
                            <p>₹44 x 5</p>
                            </div>
                            <p class="item-total">{summary.totalCount}</p>
                        </div>

                        <div class="summary-line">
                            <span>Subtotal</span><span id="order-subtotal">₹{summary.totalPrice}</span>
                        </div>

                        <div class="summary-line">
                            <span>Shipping</span><span id="order-shipping">₹0</span>
                        </div>
                        
                        <div class="summary-line total">
                            <span>Total</span><span id="order-total">₹{summary.totalPrice}</span>
                        </div>

                        <button id="place-order-btn" class="place-order-btn" disabled={isPlaceOrderDisabled} onclick={onPlaceOrderHandler}>
                            Place Order
                        </button>
                    </div>
                </div>
            </div>
        </section>
</template>
