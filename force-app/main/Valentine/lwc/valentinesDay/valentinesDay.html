<template>
    <div class="container" onmousemove={handleMouseMove} onclick={handleContainerClick} style={backgroundStyle}>
        
        <div class="bg-slider">
            <div class="slide slide1"></div>
            <div class="slide slide2"></div>
            <div class="slide slide3"></div>
            <div class="slide slide4"></div>
            <div class="slide slide5"></div>
        </div>

        <div class="content">
            <template lwc:if={isAsking}>
                <h1>💖 ..  Will you be my Valentine? 💖</h1>
                <div class="buttons">
                    <button class="yes-btn" onclick={handleYesClick} style={yesButtonStyle}>Yes 💕</button>
                    <button class="no-btn" style={noButtonStyle}>No 🙈</button>
                </div>
            </template>

            <template lwc:else>
                <h1>💖 .. Will you be my Wifey?? 💖</h1>
                <div class="avatar">{avatarExpression}</div>
                <div class="grid-holder">
                    <div class="grid">
                        <template for:each={tiles} for:item="tile">
                            <div key={tile.id} class="tile" data-id={tile.id} onclick={handleTileClick}>
                                {tile.value}
                            </div>
                        </template>
                    </div>
                </div>
                <template if:true={showMessage}>
                    <p class="message">Yay! 💖 You said Yes!</p>
                </template>
                <canvas class="confetti-canvas" lwc:dom="manual"></canvas>
            </template>
        </div>
    </div>
</template>
